---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json

type: dnf
repos:
  cleanup: true
  copr:
    enable:
      - scottames/ghostty
install:
  packages:
    - zsh
    - fzf
    - zoxide
    - fastfetch
    - hyfetch
    - git
    - gh
    - btop
    - firefox
    - ghostty
    - https://vencord.dev/download/vesktop/amd64/rpm
remove:
  packages:
    - waydroid
    - waydroid-selinux
    - input-remapper
    - bazaar
    - krunner-bazaar
    - kde-connect
    - kdeconnectd
    - kde-connect-libs
    - topgrade
    - bazzite-portal
    # Bold Brew
